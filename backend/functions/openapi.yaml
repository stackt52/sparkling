components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token
  responses:
    ValidationError:
      description: validation_error (400)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthenticated:
      description: unauthenticated (401)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: forbidden (403)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: not_found (404)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: conflict / invalid_transition (409)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: rate_limited (429)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Internal:
      description: internal (500) — never includes stack traces
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - unauthenticated
                - forbidden
                - not_found
                - validation_error
                - conflict
                - invalid_transition
                - invalid_otp
                - rate_limited
                - internal
            message:
              type: string
            details:
              type: array
              items: {}
            correlation_id:
              type: string
          required:
            - code
            - message
            - correlation_id
      required:
        - error
    Profile:
      type: object
      properties:
        id:
          type: string
          description: Firebase UID
        role:
          type: string
          enum:
            - customer
            - technician
            - supervisor
            - manager
            - admin
            - finance
        full_name:
          type: string
        email:
          type: string
          format: email
          nullable: true
        phone:
          type: string
          nullable: true
        avatar_url:
          type: string
          nullable: true
        is_active:
          type: boolean
        marketing_opt_in:
          type: boolean
        whatsapp_opt_in:
          type: boolean
        push_opt_in:
          type: boolean
        locale:
          type: string
        reduced_motion:
          type: boolean
        haptics:
          type: boolean
        last_seen_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - role
        - full_name
    Outlet:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        address_line:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        province:
          type: string
          nullable: true
        country:
          type: string
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
        phone:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        timezone:
          type: string
        opening_hours:
          type: object
          additionalProperties: true
        slot_minutes:
          type: integer
        bay_count:
          type: integer
        rating:
          type: number
          nullable: true
        is_active:
          type: boolean
        distance_km:
          type: number
          description: Present when ?lat&lng supplied
    Service:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        category:
          type: string
          enum:
            - car_wash
            - auto_body
        duration_minutes:
          type: integer
        base_price_cents:
          type: integer
        is_quote_based:
          type: boolean
        points_per_rand:
          type: number
        icon:
          type: string
          nullable: true
        checklist_template_id:
          type: string
          format: uuid
          nullable: true
        is_active:
          type: boolean
        sort_order:
          type: integer
    OutletService:
      type: object
      properties:
        outlet_id:
          type: string
          format: uuid
        service_id:
          type: string
          format: uuid
        price_cents:
          type: integer
          description: null = inherit the service base price
          nullable: true
        is_available:
          type: boolean
      required:
        - outlet_id
        - service_id
        - price_cents
        - is_available
    Slot:
      type: object
      properties:
        slot_start:
          type: string
          format: date-time
        slot_end:
          type: string
          format: date-time
        capacity:
          type: integer
        booked:
          type: integer
        available:
          type: boolean
    Vehicle:
      type: object
      properties:
        id:
          type: string
          format: uuid
        customer_id:
          type: string
        registration_no:
          type: string
        vin:
          type: string
          nullable: true
        engine_no:
          type: string
          nullable: true
        make:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
        colour:
          type: string
          nullable: true
        year:
          type: integer
          nullable: true
        licence_no:
          type: string
          nullable: true
        disc_expiry:
          type: string
          format: date
          nullable: true
        source:
          type: string
          enum:
            - manual
            - scan
        disc_verified:
          type: boolean
        disc_hash:
          type: string
          nullable: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    VehicleCreate:
      type: object
      properties:
        registration_no:
          type: string
        vin:
          type: string
          minLength: 17
          maxLength: 17
          nullable: true
        make:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
        colour:
          type: string
          nullable: true
        year:
          type: integer
          nullable: true
        licence_no:
          type: string
          nullable: true
        disc_expiry:
          type: string
          format: date
          nullable: true
        engine_no:
          type: string
          nullable: true
        source:
          type: string
          enum:
            - manual
            - scan
        disc_hash:
          type: string
          description: sha256 of the raw disc payload (raw is never stored)
          nullable: true
        force:
          type: boolean
        client_op_id:
          type: string
      required:
        - registration_no
    ParsedDisc:
      type: object
      properties:
        registration_no:
          type: string
        licence_no:
          type: string
          nullable: true
        vehicle_register_no:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        make:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
        colour:
          type: string
          nullable: true
        vin:
          type: string
          nullable: true
        engine_no:
          type: string
          nullable: true
        disc_expiry:
          type: string
          format: date
          nullable: true
        disc_hash:
          type: string
        warnings:
          type: array
          items:
            type: string
        source:
          type: string
          enum:
            - scan
    WorkOrderSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ref:
          type: string
        status:
          type: string
          enum:
            - queued
            - assigned
            - in_progress
            - blocked
            - completed
            - verified
            - cancelled
        stage:
          type: integer
        stage_count:
          type: integer
        progress_pct:
          type: integer
        eta_at:
          type: string
          format: date-time
          nullable: true
        assignee_name:
