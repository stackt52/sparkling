# Generated by scripts/gen-openapi.cjs — edit that file, then `node scripts/gen-openapi.cjs`.
openapi: 3.0.3
info:
  title: Sparkling REST API
  version: 1.0.0
  description: >-
    Sparkling platform backend (SRS v1.0). All JSON, snake_case, ISO-8601 UTC timestamps, money in integer ZAR cents. Mutating routes accept `Idempotency-Key` (or `client_op_id` in the body); replays
    return the cached first response. Every response carries `X-Correlation-Id`. Clients send `X-Client-App` and `X-Client-Version`.
  contact:
    name: Sparkling engineering
    email: dev@sparkling.co.za
  license:
    name: Proprietary
    url: https://sparkling.co.za/legal
servers:
  - url: https://europe-west1-sparkling-4e89d.cloudfunctions.net/api/v1
    description: dev (Cloud Functions 2nd gen)
  - url: http://127.0.0.1:5001/sparkling-4e89d/europe-west1/api/v1
    description: Firebase emulator
tags:
  - name: Auth & profile
    description: Auth & profile endpoints
  - name: Catalogue
    description: Catalogue endpoints
  - name: Vehicles
    description: Vehicles endpoints
  - name: Bookings
    description: Bookings endpoints
  - name: Quotations
    description: Quotations endpoints
  - name: Payments
    description: Payments endpoints
  - name: Loyalty
    description: Loyalty endpoints
  - name: Memberships
    description: Memberships endpoints
  - name: Staff
    description: Staff endpoints
  - name: Inventory
    description: Inventory endpoints
  - name: Admin
    description: Admin endpoints
  - name: Notifications
    description: Notifications endpoints
  - name: Public quote page
    description: Public quote page endpoints
  - name: System
    description: System endpoints
security:
  - bearerAuth: []
paths:
  /config:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  flags:
                    type: object
                    properties:
                      cash_on_collection:
                        type: boolean
                      payments_sandbox:
                        type: boolean
                      whatsapp_enabled:
                        type: boolean
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
      tags:
        - System
      operationId: getConfig
      summary: Public-safe feature flags (no auth)
      security: []
  /health:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  version:
                    type: string
                  service:
                    type: string
                  time:
                    type: string
