openapi: 3.0.3
info:
  title: Sparkling REST API
  version: 1.0.0
  description: >-
    Sparkling platform backend (SRS v1.0). All JSON, snake_case, ISO-8601 UTC timestamps, money in integer ZAR cents. Mutating routes accept `Idempotency-Key` (or `client_op_id` in the body); replays
    return the cached first response. Every response carries `X-Correlation-Id`. Clients send `X-Client-App` and `X-Client-Version`.
  contact:
    name: Sparkling engineering
    email: dev@sparkling.co.za
  license:
    name: Proprietary
    url: https://sparkling.co.za/legal
servers:
  - url: https://europe-west1-sparkling-4e89d.cloudfunctions.net/api/v1
    description: dev (Cloud Functions 2nd gen)
  - url: http://127.0.0.1:5001/sparkling-4e89d/europe-west1/api/v1
    description: Firebase emulator
tags:
  - name: Auth & profile
    description: Auth & profile endpoints
  - name: Catalogue
    description: Catalogue endpoints
  - name: Vehicles
    description: Vehicles endpoints
  - name: Bookings
    description: Bookings endpoints
  - name: Quotations
    description: Quotations endpoints
  - name: Payments
    description: Payments endpoints
  - name: Loyalty
