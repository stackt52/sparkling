        - Catalogue
      operationId: getAvailability
      summary: Bookable slots for a service at an outlet on a date
      parameters:
        - name: outlet_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: service_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
  /vehicles:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Vehicle'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
