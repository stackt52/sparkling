                    nullable: true
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
      tags:
        - Auth & profile
      operationId: getMe
      summary: Current profile, outlets, loyalty account and membership summary
    patch:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile:
                    $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
      tags:
        - Auth & profile
      operationId: patchMe
      summary: Update editable profile fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name:
                  type: string
                phone:
                  type: string
                  nullable: true
                avatar_url:
                  type: string
                  nullable: true
                marketing_opt_in:
                  type: boolean
                whatsapp_opt_in:
                  type: boolean
                push_opt_in:
                  type: boolean
                locale:
                  type: string
                reduced_motion:
                  type: boolean
                haptics:
                  type: boolean
  /devices:
    post:
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  device:
                    type: object
                    additionalProperties: true
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
      tags:
        - Auth & profile
      operationId: postDevice
      summary: Register an FCM device token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                platform:
                  type: string
                  enum:
                    - android
                    - ios
                    - web
                app:
                  type: string
                  enum:
                    - customer
                    - staff
                    - admin
              required:
                - token
                - platform
                - app
  /devices/{token}:
    delete:
      responses:
        '204':
          description: Removed
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
      tags:
        - Auth & profile
      operationId: deleteDevice
      summary: Remove a device token
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
  /outlets:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Outlet'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
      tags:
        - Catalogue
      operationId: listOutlets
      summary: Active outlets (optionally sorted by distance)
      parameters:
        - name: lat
          in: query
          required: false
          schema:
            type: number
        - name: lng
          in: query
          required: false
          schema:
            type: number
  /outlets/{id}/services:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/OutletServiceOffer'
                        - type: object
                          properties:
                            membership:
                              type: object
                              properties:
                                membership_id:
                                  type: string
                                  format: uuid
                                plan_code:
                                  type: string
                                plan_name:
                                  type: string
                                benefit:
                                  type: string
                                  enum:
                                    - included
                                    - discount
                                  nullable: true
                                entitlement_id:
                                  type: string
                                  format: uuid
                                  nullable: true
                                entitlement_code:
                                  type: string
                                  nullable: true
                                remaining_after:
                                  type: integer
                                  nullable: true
                                period_end:
                                  type: string
                                  format: date-time
                                  nullable: true
                              nullable: true
                  groups:
                    type: array
                    items:
                      type: string
                      enum:
                        - Car Wash Options
                        - Combinations
                        - Auto Body Repair
                  tier:
                    type: string
                    enum:
                      - silver
                      - gold
                      - platinum
                      - black
                  vehicle_size:
                    type: string
                    enum:
                      - small
                      - large
                      - bike
                    nullable: true
                  membership:
                    type: object
                    properties:
                      plan_code:
                        type: string
                      plan_name:
                        type: string
                      status:
                        type: string
                        enum:
                          - pending
                          - active
                          - past_due
                          - cancelled
                          - expired
                    nullable: true
                required:
                  - data
                  - groups
                  - tier
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
      tags:
        - Catalogue
      operationId: listOutletServices
      summary: >-
        Offers at an outlet: per-size prices, composition, add-ons, grouped (with ?vehicle_size: price_cents/total resolved for that size and the caller’s membership — covered services come back at R0
        with "Included in Gold · 3 of 4 left")
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: vehicle_size
          in: query
          required: false
          schema:
            type: string
            enum:
              - small
              - large
              - bike
  /availability:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Slot'
                  outlet_id:
                    type: string
                    format: uuid
                  service_id:
                    type: string
                    format: uuid
                  date:
                    type: string
                    format: date
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
