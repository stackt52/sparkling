<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Demo photo: rear bumper, left corner">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D9E6F2"/><stop offset="1" stop-color="#EBF1F7"/></linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8E99A6"/><stop offset="1" stop-color="#5C6874"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B8C4CF"/><stop offset="1" stop-color="#8FA0AE"/></linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#sky)"/>
  <rect y="420" width="800" height="180" fill="url(#floor)"/>
  <!-- rear of car -->
  <rect x="120" y="150" width="560" height="230" rx="40" fill="url(#body)"/>
  <rect x="180" y="110" width="440" height="110" rx="30" fill="#3D4852"/>
  <rect x="200" y="125" width="400" height="80" rx="20" fill="#1F2A35" opacity="0.85"/>
  <rect x="120" y="300" width="560" height="110" rx="30" fill="#6C7884"/>
  <rect x="140" y="320" width="150" height="40" rx="10" fill="#F3DDA4"/>
  <rect x="510" y="320" width="150" height="40" rx="10" fill="#F3DDA4"/>
  <rect x="330" y="335" width="140" height="42" rx="6" fill="#FFFFFF" stroke="#203060" stroke-width="3"/>
  <text x="400" y="365" font-family="ui-monospace, Menlo, monospace" font-size="24" font-weight="700" text-anchor="middle" fill="#203060">KL 45 MN GP</text>
  <!-- wheels -->
  <rect x="150" y="380" width="90" height="60" rx="18" fill="#1F2A35"/>
  <rect x="560" y="380" width="90" height="60" rx="18" fill="#1F2A35"/>
  <!-- damage: scuffed corner + crack -->
  <path d="M130 330 q 40 -10 70 20 q 20 25 -10 55 q -40 15 -70 -10 z" fill="#D9C4A2" opacity="0.9"/>
  <path d="M150 345 l 25 12 l -8 18 l 30 14 l -12 20" fill="none" stroke="#3A2A1A" stroke-width="4" stroke-linecap="round"/>
  <circle cx="165" cy="360" r="46" fill="none" stroke="#BA1A1A" stroke-width="5" stroke-dasharray="10 8"/>
  <!-- label -->
  <rect x="24" y="24" width="300" height="46" rx="23" fill="#203060"/>
  <text x="174" y="54" font-family="Outfit, system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#FFFFFF">Demo photo · rear bumper</text>
</svg>
