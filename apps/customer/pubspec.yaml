name: sparkling_customer
description: "Sparkling customer app — bookings, licence-disc scanning, tracking, loyalty (SRS CUS-*)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  sparkling_ui:
    path: ../../packages/sparkling_ui
  sparkling_core:
    path: ../../packages/sparkling_core
  go_router: ^17.0.1
  animations: ^2.0.11
  mobile_scanner: ^7.1.4
  image_picker: ^1.2.1
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  firebase_messaging: ^16.2.2
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#203060"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true
